<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tailorbird Rig · Lottie Studio</title><link rel="stylesheet" href="/assets/viewer.css"><style>.studio{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:24px;padding:24px}.preview{border:1px solid #ffffff20;border-radius:16px;background:#080d16;min-height:400px;display:grid;place-items:center;overflow:hidden}#player{width:100%;height:440px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}textarea{width:100%;height:370px;color:#d4e8ff;background:#0b1018;border:1px solid #425269;padding:14px;font:12px/1.6 monospace;border-radius:12px}.controls input[type=range]{flex:1}pre{white-space:pre-wrap;color:#a8bcd4}label{display:inline-flex;gap:6px;align-items:center}input{background:#202b3b;color:#eef3fa;padding:6px;border:1px solid #52627b;border-radius:5px}input[type=number]{width:75px}@media(max-width:800px){.studio{grid-template-columns:1fr}#player{height:320px}}</style><header><div class="brand">TAILORBIRD RIG / LOTTIE STUDIO</div><h1>动画制作与实际播放</h1><p>生成起点、编辑标准 JSON、检查结构、SVG / Canvas 回放；生成器保留在设计项目中。</p><a href="/">返回设计评审</a></header><div class="studio"><section><div class="preview"><div id="player"></div></div><div class="controls"><button id="play" disabled>播放</button><button id="pause" disabled>暂停</button><button id="replay" disabled>重播</button><select id="renderer"><option value="svg">SVG</option><option value="canvas">Canvas</option></select><select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="2">2×</option></select><label><input id="loop" type="checkbox">循环</label></div><div class="controls"><input id="timeline" aria-label="动画时间轴" type="range" min="0" max="100" value="0"><span id="time">0 / 0 帧</span></div><p id="status" role="status">正在初始化…</p><pre id="inspection"></pre></section><section><h2>可重建的动画起点</h2><div class="controls"><select id="motion"><option value="bounce">弹性落位</option><option value="pulse">缩放脉冲</option><option value="draw">路径绘制</option></select><input id="color" aria-label="动画颜色" type="color" value="#1478ff"><label>时长<input id="duration" type="number" min="0.2" max="20" step="0.1" value="2"></label><button id="generate">生成 JSON</button></div><div class="controls"><input id="file" aria-label="导入Lottie文件" type="file" accept="application/json,.json"><button id="apply">检查并加载编辑</button></div><textarea id="source" aria-label="Lottie JSON编辑器" spellcheck="false"></textarea><div class="controls"><button id="download">下载 JSON</button><button id="generator">下载生成器</button><select id="animations" aria-label="项目动画"><option value="">项目动画…</option></select></div><p>示例是制作起点，可按具体运动要求改写生成器或 JSON。结构检查不等于视觉或原生播放器验收；此处锁定 lottie-web 5.12.2，离线可用。</p></section></div><script src="/assets/vendor/lottie-5.12.2.min.js"></script><script src="/assets/lottie-studio.js"></script></html>
