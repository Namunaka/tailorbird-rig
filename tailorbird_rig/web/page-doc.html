<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>产品与测试文档 · Tailorbird Rig</title>
 <link rel="stylesheet" href="/assets/viewer.css">
 <style>
 .document{max-width:1120px;margin:auto;padding:clamp(16px,4vw,48px);display:block}
 .document header{padding:0 0 20px}
 .document nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
 .document h1{font-size:clamp(25px,4vw,38px);overflow-wrap:anywhere}
 .document h2{margin:0 0 12px}
 .doc-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,30%);gap:20px;margin-top:20px}
 .document [hidden]{display:none}
 .doc-section,.doc-preview{padding:20px;border:1px solid #2a3543;border-radius:12px;background:#181e26}
 .doc-section{margin-bottom:16px;scroll-margin-top:12px}
 .doc-section ul,.doc-section ol{padding-inline-start:24px}
 .doc-section li{margin-block:7px}
 .doc-case{padding-top:12px;border-top:1px solid #ffffff20;margin-top:14px}
 .doc-case h3,.doc-case h4{margin:0 0 5px}
 .doc-case h4{color:#a6c7ed;font-size:13px}
 .doc-preview{align-self:start}
 .doc-preview img{display:block;max-width:100%;max-height:560px;margin:10px auto}
 .doc-preview label,.doc-preview select{display:block;width:100%}
 @media(max-width:700px){.doc-layout{grid-template-columns:minmax(0,1fr)}.doc-preview{grid-row:1}.doc-preview img{max-height:340px}}
 </style>
</head>
<body>
 <main class="document">
  <header>
   <div class="brand">TAILORBIRD RIG · 产品与测试文档</div>
   <h1 id="doc-title">正在读取设计稿…</h1>
   <p id="doc-meta" role="status"></p>
   <nav aria-label="文档目录" hidden>
    <a class="tool-link" href="#product">产品说明</a>
    <a class="tool-link" href="#test">测试用例</a>
    <a class="tool-link" id="doc-review">打开对应评审稿</a>
   </nav>
  </header>
  <div class="doc-layout" hidden>
   <div>
    <section class="doc-section" id="product"><h2>产品说明</h2><div></div></section>
    <section class="doc-section" id="test"><h2>测试用例</h2><div></div></section>
   </div>
   <section class="doc-preview" aria-labelledby="doc-preview-title">
    <h2 id="doc-preview-title">设计稿参考</h2>
    <label for="doc-device">机型与形态</label>
    <select id="doc-device"></select>
    <img id="doc-image" alt="">
   </section>
  </div>
 </main>
 <script src="/assets/page-doc.js"></script>
</body>
</html>
