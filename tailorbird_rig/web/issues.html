<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tailorbird Rig·问题序列</title><style>body{margin:30px auto;max-width:1150px;padding:24px;background:#101216;color:#edf1f6;font:15px/1.9 -apple-system,sans-serif}a{color:#a6c7ed}td,th{padding:14px;border-bottom:1px solid #ffffff24;text-align:left;vertical-align:top;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}.scroll{overflow:auto}button{background:#243446;color:#e9f1fa;border:1px solid #6c879e66;border-radius:8px;padding:9px 14px;cursor:pointer}</style><h1>Tailorbird Rig · 问题序列</h1><p id="next">正在读取…</p><p>同一问题的补充保留原编号，已解决与撤回记录也保留。设计、评审工具和 App 状态分别记录。</p><p><a href="/index.html">当前设计与批注</a> · <a href="/api/review">完整圈选坐标与评论</a> · <a href="/issues.json">问题 JSON</a> · <button id="refresh">刷新记录</button></p><div class="scroll"><table><thead><tr><th>编号</th><th>问题/评论</th><th>页面与处理</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div><script>async function load(){const r=await fetch('/issues.json',{cache:'no-store'});const data=await r.json();document.querySelector('#next').textContent='下一问题号：'+String(data.next_issue_number).padStart(2,'0');const rows=document.querySelector('#rows');rows.replaceChildren();for(const item of data.issues){const tr=document.createElement('tr');for(const text of [String(item.number).padStart(2,'0'),item.user_quote,(item.page?[item.revision,item.page,item.device].join(' · ')+'\n':'')+(item.work||''),item.status+'；'+(item.user_accepted?'用户已确认':'用户未确认')]){const td=document.createElement('td');td.textContent=text;tr.append(td)}rows.append(tr)}}document.querySelector('#refresh').onclick=load;load().catch(()=>document.querySelector('#next').textContent='读取失败，请刷新重试');</script></html>
