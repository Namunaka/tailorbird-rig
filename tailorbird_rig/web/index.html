<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Tailorbird Rig</title>
 <link rel="stylesheet" href="/assets/viewer.css">
 <link rel="stylesheet" href="/assets/review.css">
</head>
<body>
 <svg class="tool-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="tool-issues" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6m-6 5h6"/></symbol>
  <symbol id="tool-data" viewBox="0 0 24 24"><path d="M8 6H6v12h2m8-12h2v12h-2M11 9h2m-2 6h2"/></symbol>
  <symbol id="tool-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v10"/></symbol>
  <symbol id="tool-download" viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4M5 15v4h14v-4"/></symbol>
  <symbol id="tool-library" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Zm-9 9 9 5 9-5m-18 4 9 5 9-5"/></symbol>
  <symbol id="tool-motion" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
  <symbol id="tool-document" viewBox="0 0 24 24"><path d="M6 4h8l4 4v12H6zM14 4v4h4M9 12h6m-6 4h5"/></symbol>
 </svg>
 <header class="viewer-header">
  <div class="viewer-heading">
   <div class="project-intro">
    <div class="brand">TAILORBIRD RIG <span>Design review harness</span></div>
    <h1 id="project-title">正在加载项目…</h1>
    <p id="project-description"></p>
   </div>
   <div class="revision-row"><label for="revision">设计版本</label><select id="revision"></select></div>
  </div>
  <nav class="viewer-tools" aria-label="评审工具导航">
   <section class="tool-group" aria-labelledby="tool-review-label">
    <h2 id="tool-review-label">问题与批注</h2>
    <div class="tool-items">
     <a class="tool-link" href="/issues.html" title="全部问题与处理记录"><svg aria-hidden="true"><use href="#tool-issues"/></svg>问题记录</a>
     <a class="tool-link" id="export" href="/api/review"><svg aria-hidden="true"><use href="#tool-data"/></svg>批注数据</a>
     <button class="tool-link tool-primary" type="button" id="handoff" title="复制待处理问题给对话"><svg aria-hidden="true"><use href="#tool-copy"/></svg><span id="handoff-label" aria-live="polite">复制待处理问题</span></button>
     <a class="tool-link" href="/api/handoff?format=markdown" download="tailorbird-feedback.md" id="handoff-download"><svg aria-hidden="true"><use href="#tool-download"/></svg>下载问题交接</a>
    </div>
   </section>
   <section class="tool-group" aria-labelledby="tool-design-label">
    <h2 id="tool-design-label">设计工具</h2>
    <div class="tool-items">
     <a class="tool-link" href="/components.html" id="component-library-link"><svg aria-hidden="true"><use href="#tool-library"/></svg>公共元素集</a>
     <a class="tool-link" href="/lottie.html" id="lottie-workbench-link"><svg aria-hidden="true"><use href="#tool-motion"/></svg>Lottie 动画工作台</a>
    </div>
   </section>
   <section class="tool-group tool-references" id="tool-project-links" aria-labelledby="tool-project-label" hidden>
    <h2 id="tool-project-label">项目资料</h2>
    <div class="tool-items" id="links"></div>
   </section>
  </nav>
  <p id="error" role="alert"></p>
 </header>
 <main>
  <aside id="states"></aside>
  <article>
   <div id="devices" aria-label="机型与形态"></div>
   <h2 id="title"></h2>
   <small id="size"></small>
   <img id="image" alt="当前设计稿">
   <a id="raw" target="_blank" rel="noopener">打开原图 ↗</a>
  </article>
 </main>
 <script src="/assets/viewer.js"></script>
</body>
</html>
